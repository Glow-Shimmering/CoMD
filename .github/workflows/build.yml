name: Build CoMD desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: dist:mac
            artifact: CoMD-macOS-arm64
          - os: windows-latest
            command: dist:win:installer
            artifact: CoMD-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec -- install-electron
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            test-results/desktop-report.json
